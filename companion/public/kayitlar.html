<!doctype html>
<html lang="tr" data-tema="koyu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e0c" />
  <title>Kayıtlar · Çınarköy Sync</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='none' stroke='%23ffb057' stroke-width='2'/></svg>" />
</head>
<body>
  <div class="ambient"></div>
  <div class="gosterge">
    <header class="ust">
      <div class="ic">
        <div class="marka">
          <div class="marka-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 5v7l4.5 3"/></svg>
          </div>
          <div class="marka-yazi"><b>Çınarköy Sync</b><span>Telefon → Bilgisayar Excel aktarımı</span></div>
        </div>
        <nav class="gezinme" aria-label="Bölümler">
          <a href="/"><span data-ikon="panel"></span><span>Panel</span></a>
          <a href="/kayitlar.html"><span data-ikon="kayit"></span><span>Kayıtlar</span></a>
          <a href="/eslesme.html"><span data-ikon="esle"></span><span>Eşleşme</span></a>
          <a href="/ayar.html"><span data-ikon="ayar"></span><span>Ayarlar</span></a>
        </nav>
        <button class="ikon-btn tema-btn" type="button" aria-label="Temayı değiştir">
          <span class="ay"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg></span>
          <span class="gunes"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.6M12 19.6v2.6M3.5 3.5l1.8 1.8M18.7 18.7l1.8 1.8M1.8 12h2.6M19.6 12h2.6M3.5 20.5l1.8-1.8M18.7 5.3l1.8-1.8"/></svg></span>
        </button>
      </div>
    </header>

    <main class="ana">
      <div class="kabuk">
        <section class="kart">
          <div class="kart-bas">
            <h2>Tüm kayıtlar</h2>
            <span class="rozet" id="toplam">—</span>
            <div class="canli" id="canli"><span class="nokta"></span><span>Bağlanıyor</span></div>
          </div>
          <div class="kart-govde" style="padding-bottom:8px">
            <div class="ara-kutu" style="max-width:420px">
              <span data-ikon="ara"></span>
              <input type="text" id="q" placeholder="Plaka, isim, firma, daire ara…" autocomplete="off" />
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
              <button class="dugme sade kucuk" type="button" id="sadeAktif">Tümü</button>
              <button class="dugme sade kucuk" type="button" id="sadeSilinen">Silinenler</button>
              <span class="bosluk" style="flex:1"></span>
              <button class="dugme kucuk" type="button" id="excelIndir"><span data-ikon="indir"></span>Excel dosyası</button>
            </div>
          </div>
          <div class="tablo-sarmal">
            <table>
              <thead>
                <tr><th>Tarih</th><th>Saat</th><th>Plaka</th><th>Blok / Daire</th><th>Kurye</th><th>Firma</th><th>Görevli</th><th>Not</th></tr>
              </thead>
              <tbody id="govde">
                <tr><td colspan="8"><div class="iskelet" style="height:14px;margin:6px 0"></div><div class="iskelet" style="height:14px;margin:6px 0"></div><div class="iskelet" style="height:14px;margin:6px 0"></div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="sayfalama">
            <button class="dugme sade kucuk" type="button" id="onceki"><span data-ikon="geri"></span>Önceki</button>
            <span class="mono" id="sayfa">—</span>
            <button class="dugme sade kucuk" type="button" id="sonraki">Sonraki<span data-ikon="ok"></span></button>
            <span class="bosluk"></span>
            <span id="sayfaBilgi"></span>
          </div>
        </section>
      </div>

      <footer class="alt-bilgi kabuk">
        <span>Çınarköy Güvenlik · veriler bu bilgisayarda saklanır</span>
        <span class="mono" id="sure"></span>
      </footer>
    </main>
  </div>

  <script src="assets/core.js"></script>
  <script>
  (function () {
    "use strict";
    document.querySelectorAll("[data-ikon]").forEach(function (el) { el.innerHTML = CK.ikon(el.dataset.ikon); });

    var LIMIT = 50, offset = 0, toplam = 0, sorgu = "", sadeSilinen = false;
    var govde = document.getElementById("govde");
    var canliEl = document.getElementById("canli");
    var aramaZaman = null;

    function satir(k) {
      var tr = document.createElement("tr");
      if (k.deleted) tr.className = "silindi";
      tr.innerHTML =
        '<td class="mono dim">' + CK.kacis(k.ts ? CK.tarihTR(k.ts) : k.date || "") + "</td>" +
        '<td class="mono dim">' + CK.kacis(k.time || (k.ts ? CK.saatTR(k.ts) : "")) + "</td>" +
        '<td class="plaka">' + CK.kacis(k.plate) +
          (k.deleted ? ' <span class="rozet uyari">SİLİNDİ</span>' : "") + "</td>" +
        '<td class="dim">' + CK.kacis((k.site || "") + (k.unit ? " / " + k.unit : "")) + "</td>" +
        "<td>" + CK.kacis(k.courier) + "</td>" +
        '<td class="dim">' + CK.kacis(k.company || "") + "</td>" +
        '<td class="dim">' + CK.kacis(k.guard || "") + "</td>" +
        '<td class="dim">' + CK.kacis(k.note || "") + "</td>";
      return tr;
    }

    function ciz(veri) {
      toplam = veri.total;
      document.getElementById("toplam").textContent = toplam + " kayıt";
      govde.innerHTML = "";
      var kayitlar = veri.records || [];
      if (sadeSilinen) kayitlar = kayitlar.filter(function (k) { return k.deleted; });
      if (!kayitlar.length) {
        govde.innerHTML = '<tr><td colspan="8"><div class="bos">' + CK.ikon("ara") +
          "<p>Eşleşen kayıt yok.</p></div></td></tr>";
      } else {
        kayitlar.forEach(function (k) { govde.appendChild(satir(k)); });
      }
      var son = Math.min(offset + LIMIT, toplam);
      document.getElementById("sayfa").textContent = toplam ? (offset + 1) + "–" + son + " / " + toplam : "0 kayıt";
      document.getElementById("sayfaBilgi").textContent = sorgu ? 'Arama: "' + sorgu + '"' : "";
    }

    function yukle(yeniOffset) {
      if (yeniOffset != null) offset = Math.max(0, yeniOffset);
      var url = "/kayitlar?limit=" + LIMIT + "&offset=" + offset + "&q=" + encodeURIComponent(sorgu);
      CK.istek(url)
        .then(function (r) { return r.json(); })
        .then(ciz)
        .catch(function () { CK.bildir("Kayıtlar alınamadı", "hatali"); });
    }

    document.getElementById("q").addEventListener("input", function (e) {
      clearTimeout(aramaZaman);
      sorgu = e.target.value.trim();
      aramaZaman = setTimeout(function () { yukle(0); }, 260);
    });
    document.getElementById("onceki").addEventListener("click", function () { yukle(offset - LIMIT); });
    document.getElementById("sonraki").addEventListener("click", function () {
      if (offset + LIMIT < toplam) yukle(offset + LIMIT);
    });
    document.getElementById("sadeSilinen").addEventListener("click", function () {
      sadeSilinen = !sadeSilinen;
      this.classList.toggle("dugme", false);
      this.classList.toggle("sade", !sadeSilinen);
      yukle(0);
    });
    document.getElementById("sadeAktif").addEventListener("click", function () {
      sadeSilinen = false;
      this.classList.remove("sade");
      this.classList.add("dugme");
      yukle(0);
    });
    document.getElementById("excelIndir").addEventListener("click", function () {
      CK.bildir("Excel dosyası bilgisayarda zaten güncel: companion/data/kayitlar.xlsx", "bilgi");
    });

    var canliBag = new CK.Canli(function () {
      var self = this;
      this.durumTetik = function (d) {
        if (d) document.getElementById("sure").textContent = d.sonYazma ? "Son yazma " + CK.tamZaman(d.sonYazma) : "";
      };
      self.izle(function (aktif, veri) {
        canliEl.className = "canli " + (aktif ? "aktif" : "hata");
        canliEl.lastElementChild.textContent = aktif ? "Canlı akış" : "Bağlantı bekleniyor";
        if (veri && veri.tip) yukle(offset === 0 ? 0 : undefined);
      });
      self.tazele();
      yukle(0);
    });
    canliBag.baglan();
  })();
  </script>
</body>
</html>
