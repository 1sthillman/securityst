<!doctype html>
<html lang="tr" data-tema="koyu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performans İstatistikleri · Çınarköy Sync</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
  <style>
    .perf-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border-radius: 12px; padding: 20px; border: 1px solid var(--line); }
    .stat-value { font-size: 2rem; font-weight: 700; margin: 8px 0 4px 0; color: var(--accent); }
    .stat-label { color: var(--text-2); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .guard-list { background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 24px; border: 1px solid var(--line); }
    .guard-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border-radius: 8px; margin-bottom: 10px; background: var(--surface-2); flex-wrap: wrap; gap: 12px; }
    .guard-name { font-weight: 700; font-size: 1rem; min-width: 150px; }
    .guard-stats { display: flex; gap: 16px; font-size: 0.85rem; color: var(--text-2); flex-wrap: wrap; }
    .chart-container { background: var(--surface); border-radius: 12px; padding: 20px; margin-bottom: 24px; border: 1px solid var(--line); }
    .chart-container h3 { margin: 0 0 16px 0; font-size: 1rem; font-weight: 700; }
    .filter-bar { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); }
    .filter-bar select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--text); font-size: 0.85rem; }
    .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-2); }
  </style>
</head>
<body>
  <nav class="gezinme" aria-label="Bölümler" style="padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line)">
    <a href="/"><span data-ikon="panel"></span><span>Panel</span></a>
    <a href="/kayitlar.html"><span data-ikon="kayit"></span><span>Kayıtlar</span></a>
    <a href="/plakalar.html"><span data-ikon="plaka"></span><span>Plakalar</span></a>
    <a href="/siteler.html"><span data-ikon="tablo"></span><span>Siteler</span></a>
    <a href="/blacklist.html"><span data-ikon="uyari"></span><span>Blacklist</span></a>
    <a href="/performans.html"><span data-ikon="grafik"></span><span>Performans</span></a>
    <a href="/ayar.html"><span data-ikon="ayar"></span><span>Ayarlar</span></a>
  </nav>

  <div class="perf-container">
    <div style="margin-bottom:24px">
      <h1 style="margin:0 0 6px 0;font-size:1.6rem;font-weight:700">Performans İstatistikleri</h1>
      <p style="color:var(--text-2);margin:0;font-size:0.9rem">Görevli performansı, kayıt trendleri ve detaylı analizler</p>
    </div>

    <div class="filter-bar">
      <label style="font-weight:600;color:var(--text);font-size:0.85rem">Dönem:</label>
      <select id="periodFilter">
        <option value="today">Bugün</option>
        <option value="week" selected>Son 7 Gün</option>
        <option value="month">Son 30 Gün</option>
        <option value="all">Tümü</option>
      </select>
      <button id="btnRefresh" class="btn" style="margin-left:auto;background:var(--ok);color:#fff">Yenile</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Toplam Kayıt</div>
        <div class="stat-value" id="totalRecords">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Aktif Görevli</div>
        <div class="stat-value" id="activeGuards">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">En Aktif Görevli</div>
        <div class="stat-value" style="font-size:1.3rem" id="topGuard">-</div>
        <div class="stat-label" id="topGuardCount"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Günlük Ortalama</div>
        <div class="stat-value" id="avgPerDay">-</div>
      </div>
    </div>

    <div class="chart-container">
      <h3>Günlük Kayıt Trendi</h3>
      <canvas id="trendChart" height="60"></canvas>
    </div>

    <div class="guard-list">
      <h3 style="margin:0 0 16px 0;font-size:1rem;font-weight:700">Görevli Detayları</h3>
      <div id="guardList"></div>
    </div>

    <div class="chart-container">
      <h3>Kayıt Türü Dağılımı</h3>
      <canvas id="typeChart" height="60"></canvas>
    </div>
  </div>

  <script src="assets/core.js"></script>
  <script>
    document.querySelectorAll("[data-ikon]").forEach(el => el.innerHTML = CK.ikon(el.dataset.ikon));
    
    let trendChart = null;
    let typeChart = null;

    function getPeriodTimestamp() {
      const period = document.getElementById('periodFilter').value;
      const now = Date.now();
      switch(period) {
        case 'today': return new Date().setHours(0,0,0,0);
        case 'week': return now - (7 * 86400000);
        case 'month': return now - (30 * 86400000);
        default: return 0;
      }
    }

    async function loadStats() {
      try {
        const startDate = getPeriodTimestamp();
        const res = await CK.istek(`/stats/performance?startDate=${startDate}`);
        const data = await res.json();
        
        if (data.ok) {
          document.getElementById('totalRecords').textContent = data.totalRecords.toLocaleString('tr-TR');
          document.getElementById('activeGuards').textContent = data.guards.length;
          
          if (data.topGuard) {
            document.getElementById('topGuard').textContent = data.topGuard.guard;
            document.getElementById('topGuardCount').textContent = `${data.topGuard.totalRecords} kayıt`;
          } else {
            document.getElementById('topGuard').textContent = '-';
            document.getElementById('topGuardCount').textContent = '';
          }
          
          const avgPerDay = data.guards.length > 0 
            ? (data.totalRecords / Math.max(1, (Date.now() - startDate) / 86400000)).toFixed(1)
            : 0;
          document.getElementById('avgPerDay').textContent = avgPerDay;
          
          renderGuardList(data.guards);
          await renderCharts(data);
        }
      } catch (e) {
        console.error('[Performans] Yükleme hatası:', e);
        document.getElementById('guardList').innerHTML = '<div class="empty-state"><p>Veriler yüklenirken hata oluştu</p></div>';
      }
    }

    function renderGuardList(guards) {
      const container = document.getElementById('guardList');
      if (!guards || guards.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>Henüz kayıt yok</p></div>';
        return;
      }
      
      container.innerHTML = guards.map(g => `
        <div class="guard-item">
          <div class="guard-name">${CK.kacis(g.guard)}</div>
          <div class="guard-stats">
            <span><strong>${g.totalRecords}</strong> kayıt</span>
            <span><strong>${Object.keys(g.sites).length}</strong> site</span>
            <span><strong>${g.avgPerDay}</strong>/gün</span>
          </div>
          <div style="font-size:0.8rem;color:var(--text-2)">
            ${Object.entries(g.types).map(([t,c]) => `${t}: ${c}`).join(', ')}
          </div>
        </div>
      `).join('');
    }

    async function renderCharts(data) {
      try {
        const dashRes = await CK.istek('/stats/dashboard');
        const dashData = await dashRes.json();
        
        if (dashData.ok) {
          if (trendChart) {
            trendChart.destroy();
            trendChart = null;
          }
          
          const ctx1 = document.getElementById('trendChart').getContext('2d');
          trendChart = new Chart(ctx1, {
            type: 'line',
            data: {
              labels: dashData.last7Days.map(d => new Date(d.date).toLocaleDateString('tr-TR', {month: 'short', day: 'numeric'})),
              datasets: [{
                label: 'Günlük Kayıt',
                data: dashData.last7Days.map(d => d.count),
                borderColor: 'rgb(255, 176, 87)',
                backgroundColor: 'rgba(255, 176, 87, 0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 3,
                pointHoverRadius: 5
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: { 
                legend: { display: false },
                tooltip: {
                  backgroundColor: 'rgba(0,0,0,0.8)',
                  padding: 10,
                  titleFont: { size: 13 },
                  bodyFont: { size: 12 }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  ticks: { precision: 0, font: { size: 11 } }
                },
                x: {
                  ticks: { font: { size: 11 } }
                }
              }
            }
          });
        }
        
        if (typeChart) {
          typeChart.destroy();
          typeChart = null;
        }
        
        const allTypes = {};
        data.guards.forEach(g => {
          Object.entries(g.types).forEach(([type, count]) => {
            allTypes[type] = (allTypes[type] || 0) + count;
          });
        });
        
        if (Object.keys(allTypes).length > 0) {
          const ctx2 = document.getElementById('typeChart').getContext('2d');
          typeChart = new Chart(ctx2, {
            type: 'doughnut',
            data: {
              labels: Object.keys(allTypes),
              datasets: [{
                data: Object.values(allTypes),
                backgroundColor: ['#ffb057', '#4ade80', '#60a5fa', '#f87171', '#a78bfa', '#fbbf24']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: {
                legend: { 
                  position: 'bottom',
                  labels: {
                    padding: 12,
                    font: { size: 11 }
                  }
                },
                tooltip: {
                  backgroundColor: 'rgba(0,0,0,0.8)',
                  padding: 10
                }
              }
            }
          });
        }
      } catch (e) {
        console.error('[Performans] Grafik hatası:', e);
      }
    }

    document.getElementById('periodFilter').addEventListener('change', loadStats);
    document.getElementById('btnRefresh').addEventListener('click', loadStats);
    
    loadStats();
  </script>
</body>
</html>
