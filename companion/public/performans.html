<!doctype html>
<html lang="tr" data-tema="koyu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performans İstatistikleri · Çınarköy Sync</title>
  <link rel="stylesheet" href="assets/theme.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); }
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .page-header { margin-bottom: 32px; }
    .page-title { font-size: 2rem; font-weight: 700; margin: 0 0 8px 0; }
    .page-subtitle { color: var(--text-2); margin: 0; font-size: 0.95rem; }
    
    .filter-bar {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border: 1px solid var(--border);
    }
    
    .filter-bar label { font-weight: 600; color: var(--text); font-size: 0.9rem; }
    .filter-bar select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    
    .stat-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
    }
    
    .stat-label {
      color: var(--text-2);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    
    .stat-meta {
      color: var(--text-2);
      font-size: 0.85rem;
    }
    
    .chart-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    
    .chart-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 20px 0;
    }
    
    .guard-list { margin-top: 24px; }
    .guard-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 180px 1fr auto;
      gap: 20px;
      align-items: center;
      transition: all 0.2s;
    }
    
    .guard-item:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }
    
    .guard-name { font-weight: 700; font-size: 1rem; }
    .guard-stats {
      display: flex;
      gap: 24px;
      font-size: 0.9rem;
    }
    
    .guard-stats span {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--text-2);
    }
    
    .guard-stats strong { color: var(--text); }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-2);
    }
    
    @media (max-width: 768px) {
      .guard-item {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .guard-stats { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="navigationPlaceholder"></div>
  
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Performans İstatistikleri</h1>
      <p class="page-subtitle">Görevli performansı, kayıt trendleri ve detaylı analizler</p>
    </div>

    <div class="filter-bar">
      <label>Dönem:</label>
      <select id="periodFilter">
        <option value="today">Bugün</option>
        <option value="week" selected>Son 7 Gün</option>
        <option value="month">Son 30 Gün</option>
        <option value="all">Tümü</option>
      </select>
      <button id="btnRefresh" class="btn btn-primary" style="margin-left:auto">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
        Yenile
      </button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Toplam Kayıt</div>
        <div class="stat-value" id="totalRecords">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Aktif Görevli</div>
        <div class="stat-value" id="activeGuards">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">En Aktif Görevli</div>
        <div class="stat-value" style="font-size:1.3rem" id="topGuard">-</div>
        <div class="stat-meta" id="topGuardCount"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Günlük Ortalama</div>
        <div class="stat-value" id="avgPerDay">-</div>
        <div class="stat-meta">kayıt/gün</div>
      </div>
    </div>

    <div class="chart-card">
      <h3 class="chart-title">Günlük Kayıt Trendi</h3>
      <canvas id="trendChart" height="80"></canvas>
    </div>

    <div class="chart-card">
      <h3 class="chart-title">Görevli Performansı</h3>
      <div class="guard-list" id="guardList"></div>
    </div>

    <div class="chart-card">
      <h3 class="chart-title">Kayıt Türü Dağılımı</h3>
      <canvas id="typeChart" height="60"></canvas>
    </div>
  </div>

  <script src="assets/core.js"></script>
  <script>
    // Load navigation
    fetch('assets/navigation.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('navigationPlaceholder').innerHTML = html;
      });
  </script>
  <script>
    let trendChart = null;
    let typeChart = null;

    function getPeriodTimestamp() {
      const period = document.getElementById('periodFilter').value;
      const now = Date.now();
      switch(period) {
        case 'today': return new Date().setHours(0,0,0,0);
        case 'week': return now - (7 * 86400000);
        case 'month': return now - (30 * 86400000);
        default: return 0;
      }
    }

    async function loadStats() {
      try {
        const startDate = getPeriodTimestamp();
        const res = await CK.istek(`/stats/performance?startDate=${startDate}`);
        const data = await res.json();
        
        if (data.ok) {
          document.getElementById('totalRecords').textContent = data.totalRecords.toLocaleString('tr-TR');
          document.getElementById('activeGuards').textContent = data.guards.length;
          
          if (data.topGuard) {
            document.getElementById('topGuard').textContent = data.topGuard.guard;
            document.getElementById('topGuardCount').textContent = `${data.topGuard.totalRecords} kayıt`;
          } else {
            document.getElementById('topGuard').textContent = '-';
            document.getElementById('topGuardCount').textContent = '';
          }
          
          const avgPerDay = data.guards.length > 0 
            ? (data.totalRecords / Math.max(1, (Date.now() - startDate) / 86400000)).toFixed(1)
            : 0;
          document.getElementById('avgPerDay').textContent = avgPerDay;
          
          renderGuardList(data.guards);
          await renderCharts(data);
        }
      } catch (e) {
        console.error('[Performans] Hata:', e);
        document.getElementById('guardList').innerHTML = '<div class="empty-state"><p>Veriler yüklenirken hata oluştu</p></div>';
      }
    }

    function renderGuardList(guards) {
      const container = document.getElementById('guardList');
      if (!guards || guards.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>Henüz kayıt yok</p></div>';
        return;
      }
      
      container.innerHTML = guards.map(g => `
        <div class="guard-item">
          <div class="guard-name">${CK.kacis(g.guard)}</div>
          <div class="guard-stats">
            <span><strong>${g.totalRecords}</strong> kayıt</span>
            <span><strong>${Object.keys(g.sites).length}</strong> site</span>
            <span><strong>${g.avgPerDay}</strong> kayıt/gün</span>
          </div>
          <div style="font-size:0.85rem;color:var(--text-2)">
            ${Object.entries(g.types).map(([t,c]) => `${t}: ${c}`).join(' · ')}
          </div>
        </div>
      `).join('');
    }

    async function renderCharts(data) {
      try {
        const dashRes = await CK.istek('/stats/dashboard');
        const dashData = await dashRes.json();
        
        if (dashData.ok) {
          if (trendChart) {
            trendChart.destroy();
            trendChart = null;
          }
          
          const ctx1 = document.getElementById('trendChart').getContext('2d');
          trendChart = new Chart(ctx1, {
            type: 'line',
            data: {
              labels: dashData.last7Days.map(d => new Date(d.date).toLocaleDateString('tr-TR', {month: 'short', day: 'numeric'})),
              datasets: [{
                label: 'Günlük Kayıt',
                data: dashData.last7Days.map(d => d.count),
                borderColor: '#ffb057',
                backgroundColor: 'rgba(255, 176, 87, 0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 4,
                pointHoverRadius: 6,
                pointBackgroundColor: '#ffb057'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: { 
                legend: { display: false },
                tooltip: {
                  backgroundColor: 'rgba(0,0,0,0.8)',
                  padding: 12,
                  titleFont: { size: 13 },
                  bodyFont: { size: 12 }
                }
              },
              scales: {
                y: {
                  beginAtZero: true,
                  ticks: { precision: 0 }
                }
              }
            }
          });
        }
        
        if (typeChart) {
          typeChart.destroy();
          typeChart = null;
        }
        
        const allTypes = {};
        data.guards.forEach(g => {
          Object.entries(g.types).forEach(([type, count]) => {
            allTypes[type] = (allTypes[type] || 0) + count;
          });
        });
        
        if (Object.keys(allTypes).length > 0) {
          const ctx2 = document.getElementById('typeChart').getContext('2d');
          typeChart = new Chart(ctx2, {
            type: 'doughnut',
            data: {
              labels: Object.keys(allTypes),
              datasets: [{
                data: Object.values(allTypes),
                backgroundColor: ['#ffb057', '#4ade80', '#60a5fa', '#f87171', '#a78bfa', '#fbbf24']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              plugins: {
                legend: { 
                  position: 'bottom',
                  labels: { padding: 15, font: { size: 12 } }
                },
                tooltip: {
                  backgroundColor: 'rgba(0,0,0,0.8)',
                  padding: 12
                }
              }
            }
          });
        }
      } catch (e) {
        console.error('[Performans] Grafik hatası:', e);
      }
    }

    document.getElementById('periodFilter').addEventListener('change', loadStats);
    document.getElementById('btnRefresh').addEventListener('click', loadStats);
    
    loadStats();
  </script>
</body>
</html>
