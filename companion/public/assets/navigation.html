<style>
  .main-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  
  .main-header .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
  }
  
  .header-content {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    gap: 32px;
  }
  
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text);
    flex-shrink: 0;
  }
  
  .brand svg {
    color: var(--accent);
  }
  
  .main-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
  }
  
  .main-nav::-webkit-scrollbar {
    display: none;
  }
  
  .main-nav a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--text-2);
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
  }
  
  .main-nav a:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  
  .main-nav a.active {
    background: var(--accent);
    color: #fff;
  }
  
  .theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: none;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  
  .theme-toggle:hover {
    background: var(--surface-3);
    transform: scale(1.05);
  }
  
  .theme-toggle .sun-icon {
    display: none;
  }
  
  .theme-toggle .moon-icon {
    display: block;
  }
  
  [data-tema="acik"] .theme-toggle .sun-icon {
    display: block;
  }
  
  [data-tema="acik"] .theme-toggle .moon-icon {
    display: none;
  }
  
  @media (max-width: 768px) {
    .header-content {
      gap: 16px;
    }
    
    .main-nav {
      gap: 2px;
    }
    
    .main-nav a {
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    
    .main-nav a span {
      display: none;
    }
  }
</style>

<script>
  (function() {
    // Set active link
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const pageName = currentPage.replace('.html', '') || 'index';
    const activeLink = document.querySelector(`[data-page="${pageName}"]`);
    if (activeLink) {
      activeLink.classList.add('active');
    }
    
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-tema');
      const newTheme = currentTheme === 'koyu' ? 'acik' : 'koyu';
      html.setAttribute('data-tema', newTheme);
      localStorage.setItem('tema', newTheme);
    });
    
    // Load saved theme
    const savedTheme = localStorage.getItem('tema') || 'koyu';
    html.setAttribute('data-tema', savedTheme);
  })();
</script>
